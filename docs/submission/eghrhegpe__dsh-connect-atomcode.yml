# Submission draft for awesome-dsh-plugin.
#
# Copy this file to `data/plugins/eghrhegpe__dsh-connect-atomcode.yml` in a fork of
# awesome-dsh-plugin/awesome-dsh-plugin and open a PR that adds only it. Do not edit that
# repository's READMEs — both are generated from data/plugins/. Do not add an `npm:` field
# (market CI rejects it); do not add screenshots here (the market reads this repo's root
# screenshots.json instead).
#
# The description is read as a claim and checked against the code line by line, so every noun
# below is one the source actually has:
#   "locally signed-in AtomCode" — the bridge never asks for an API key: `atomcode_ask` and the
#     `/atomcode-review` command authenticate with the local daemon token (~/.atomcode/daemon-13459.json).
#     See README "无 API Key" and cordis.patch.yml "There is no BRIDGE-side API key".
#   "one model tool plus one command" — `apply` in src/host/index.ts registers exactly ONE model
#     tool, atomcode_ask (side-conversation relay over daemon POST /chat SSE, with per-working_dir
#     session continuity), and registers one slash command, /atomcode-review (bounded code review
#     executed host-side against the same runAsk, so it spends no model turn).
#   "no model takeover" — v0.3 deliberately DROPPED the original provider takeover; README
#     "定位说明（v0.3 有意去接管）" and docs/DECISIONS.md state the reasons. What the plugin
#     adds instead is a read-only CodingPlan quota read-out on the settings card (quota parsed
#     from the daemon's POST /command {"command":"status"} localized text, src/host/quota.ts).
#   "one model knob" — atomcode_ask and /atomcode-review now go through the
#     same daemon /chat channel (single-channel decision, 2026-10). One dropdown on the panel,
#     one config field (default_provider), one namespace (model profile name from GET /models).
url: https://github.com/eghrhegpe/dsh-connect-atomcode
name: eghrhegpe/dsh-connect-atomcode
category: tool
description:
  en: 'Bridges the AtomCode terminal AI coding assistant already signed in on this machine into DeepSeek Harness as one model tool plus one slash command: atomcode_ask (a side-conversation relay with per-working-directory session continuity) and /atomcode-review (a host-side, bounded code review that spends no model turn). No API key to configure and no model takeover — the settings card just adds a read-only CodingPlan quota read-out and one model picker shared by both paths.'
  zh: '把本机已登录的 AtomCode 终端 AI 编程助手接入 DeepSeek Harness，提供模型侧一个工具加人侧一条斜杠命令：atomcode_ask（带按工作目录会话连续的侧边咨询）与 /atomcode-review（宿主侧执行、不花模型回合的有界代码评审）。无需配置 API key、不接管模型——设置卡片加一个只读的 CodingPlan 额度读数和两条通路共用的一个模型档位选择器。'