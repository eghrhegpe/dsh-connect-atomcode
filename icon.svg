<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- AtomCode Bridge plugin card icon.
       Motif: an "atom" (the AtomCode terminal agent) whose nucleus carries a
       terminal prompt — the bridge exposes it as side tools, not a model. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B3A67"/>
      <stop offset="1" stop-color="#5B4FD8"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <!-- atom orbits -->
  <g fill="none" stroke="#8FE3FF" stroke-opacity="0.55" stroke-width="2">
    <ellipse cx="32" cy="32" rx="20" ry="9"/>
    <ellipse cx="32" cy="32" rx="20" ry="9" transform="rotate(60 32 32)"/>
    <ellipse cx="32" cy="32" rx="20" ry="9" transform="rotate(120 32 32)"/>
  </g>
  <!-- nucleus: terminal prompt -->
  <g stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="22,26 30,32 22,38"/>
    <line x1="34" y1="38" x2="42" y2="38"/>
  </g>
</svg>
